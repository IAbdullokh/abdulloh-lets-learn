<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#2450D6"><link rel="manifest" href="manifest-dashboard.json"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Dashboard"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif;background:#F3F6FB}img{max-width:100%}[hidden]{display:none!important}</style><script src="config.js"></script><script>window.ELB_PARENT=true;</script></head><body><title>Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&display=swap">
<style>
/* Layout: sticky header (brand + live timer left, level switch right) · tab bar (bottom bar on phones) · one content column, max 980px.
   Time colours carry meaning everywhere: past = coral, present = green, future = blue. */
:root{
  --bg:#F3F6FB; --surface:#FFFFFF; --surface2:#E8EDF6; --ink:#14213D; --muted:#56627C; --line:#D8DFEB;
  --accent:#2450D6; --accent-ink:#FFFFFF; --hl:#FFE37A; --hl-ink:#14213D;
  --past:#D24E28; --present:#118A5A; --future:#2D66E6; --good:#118A5A; --bad:#C43333;
  --font:"Lexend",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1420; --surface:#161F31; --surface2:#202B42; --ink:#E8EDF7; --muted:#9DA9C2; --line:#2B3752;
  --accent:#7A9CFF; --accent-ink:#0E1420; --hl:#5A4A10; --hl-ink:#FFE9A6;
  --past:#FF8462; --present:#3FCC90; --future:#7EA5FF; --good:#3FCC90; --bad:#FF7676; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1420; --surface:#161F31; --surface2:#202B42; --ink:#E8EDF7; --muted:#9DA9C2; --line:#2B3752;
  --accent:#7A9CFF; --accent-ink:#0E1420; --hl:#5A4A10; --hl-ink:#FFE9A6;
  --past:#FF8462; --present:#3FCC90; --future:#7EA5FF; --good:#3FCC90; --bad:#FF7676; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
h1,h2,h3{line-height:1.2;text-wrap:balance;margin:0}
h1{font-size:1.6rem;font-weight:700}
h2{font-size:1.25rem;font-weight:600}
h3{font-size:1.05rem;font-weight:600}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
mark{background:var(--hl);color:var(--hl-ink);padding:0 .15em;border-radius:4px;font-weight:600}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.85rem}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:980px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;min-width:0;flex:1 1 200px}
.brand b{font-size:1.02rem;font-weight:700;letter-spacing:-.01em}
.brand{flex-direction:row!important;align-items:center;gap:10px;flex-wrap:wrap}
.brand b{font-size:1.25rem!important}
.langs{display:flex;gap:2px;background:var(--surface2);padding:3px;border-radius:10px}
.langs button{border:0;background:transparent;padding:4px 9px;border-radius:7px;font-size:.78rem;font-weight:600;color:var(--muted)}
.langs button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface2);border-radius:999px;padding:5px 11px;font-size:.85rem;font-weight:500;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.on{background:var(--present);box-shadow:0 0 0 3px color-mix(in srgb,var(--present) 25%,transparent)}
.levels{display:flex;gap:4px;background:var(--surface2);padding:4px;border-radius:12px;overflow-x:auto;scrollbar-width:none;max-width:100%}
.levels::-webkit-scrollbar{display:none}
.levels button{border:0;background:transparent;padding:7px 11px;border-radius:9px;font-size:.85rem;font-weight:500;white-space:nowrap;color:var(--muted)}
.levels button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.levels button small{display:block;font-size:.65rem;opacity:.8;line-height:1}

/* tabs */
.tabs{max-width:980px;margin:0 auto;padding:8px 16px 0;display:flex;gap:4px}
.tabs button{border:0;background:transparent;padding:9px 14px;border-radius:10px;font-weight:500;color:var(--muted);display:flex;align-items:center;gap:7px}
.tabs button[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 0 var(--line),0 0 0 1px var(--line)}
.tabs svg{width:20px;height:20px;flex:none}
@media (max-width:720px){
  .levels{width:100%}
  .levels button{flex:1 0 auto}
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));justify-content:space-around;max-width:none;gap:0}
  .tabs button{flex-direction:column;gap:2px;font-size:.68rem;padding:5px 2px;flex:1;min-width:0}
  .tabs button[aria-current="page"]{box-shadow:none;background:var(--surface2);color:var(--accent)}
  main{padding-bottom:90px!important}
}

main{max-width:980px;margin:0 auto;padding:16px 16px 40px;display:flex;flex-direction:column;gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr))}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:10px}
.btn{border:1px solid var(--line);background:var(--surface);padding:10px 16px;border-radius:12px;font-weight:500;display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink);min-height:44px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.yt{background:#E62117;border-color:#E62117;color:#fff}
.btn.sm{min-height:36px;padding:6px 12px;font-size:.9rem}
.btn svg{width:18px;height:18px;flex:none}
.eyebrow{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--muted)}
.bar{height:10px;background:var(--surface2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--present);border-radius:99px;transition:width .4s}

/* today */
.today{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.ring{width:96px;height:96px}
.ring text{fill:var(--ink);font-family:var(--font)}
.stat-row{display:flex;gap:18px;flex-wrap:wrap}
.stat b{display:block;font-size:1.2rem;font-weight:600}
.stat span{font-size:.78rem;color:var(--muted)}

/* level hero */
.hero{display:flex;flex-direction:column;gap:14px}
.hero h1 small{font-size:.9rem;font-weight:500;color:var(--muted);margin-left:6px}
.big3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.big3 div{background:var(--surface2);border-radius:12px;padding:12px}
.big3 b{display:block;font-size:1.6rem;font-weight:700;line-height:1.1}
.big3 span{font-size:.8rem;color:var(--muted)}
@media (max-width:420px){.big3 b{font-size:1.3rem}}

/* tense map */
.tmap{display:grid;grid-template-columns:auto repeat(3,1fr);gap:6px;font-size:.8rem}
.tmap .h{font-weight:600;text-align:center;padding:4px 0}
.tmap .h.past{color:var(--past)} .tmap .h.present{color:var(--present)} .tmap .h.future{color:var(--future)}
.tmap .rl{font-size:.72rem;color:var(--muted);align-self:center;padding-right:4px}
.cell{border:1px solid var(--line);border-radius:10px;padding:8px 6px;text-align:center;background:var(--surface);font-weight:500;line-height:1.25;min-height:52px;display:flex;flex-direction:column;justify-content:center;gap:2px}
.cell small{font-size:.65rem;color:var(--muted);font-weight:400}
.cell.mine{border-width:2px}
.cell.mine.past{border-color:var(--past)} .cell.mine.present{border-color:var(--present)} .cell.mine.future{border-color:var(--future)}
.cell.later{opacity:.45}
.cell.done{background:var(--surface2)}
.cell .ck{color:var(--good);font-weight:700}

/* path (a real sequence) */
.path{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;counter-reset:s}
.path li{display:flex;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.path li::before{counter-increment:s;content:counter(s);width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--surface2);font-weight:600;font-size:.85rem;flex:none}
.path li.done::before{content:"✓";background:var(--good);color:var(--surface)}
.path li .grow{flex:1;min-width:0}
.path li button{margin-left:auto}

/* tense cards */
.tcard{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px;width:100%}
.tcard:hover{border-color:var(--accent)}
.tcard .tl{width:100%;height:auto;max-width:100%}
.tag{display:inline-block;font-size:.7rem;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--surface2);color:var(--muted)}
.tag.past{color:var(--past)} .tag.present{color:var(--present)} .tag.future{color:var(--future)}
.tag.ok{background:var(--good);color:var(--surface)}
.tl text{font-family:var(--font);font-size:11px;fill:var(--muted)}

/* sheet */
.sheet{position:fixed;inset:0;z-index:50;background:rgba(10,15,30,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet-in{background:var(--bg);width:100%;max-width:760px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding:0 16px calc(24px + env(safe-area-inset-bottom,0px))}
@media (min-width:721px){.sheet{align-items:center}.sheet-in{border-radius:18px;max-height:88%}}
.sheet-head{position:sticky;top:0;background:var(--bg);padding:14px 0 10px;display:flex;align-items:center;gap:10px;z-index:2;border-bottom:1px solid var(--line)}
.sheet-body{display:flex;flex-direction:column;gap:14px;padding-top:14px}
.x{margin-left:auto;border:1px solid var(--line);background:var(--surface);width:40px;height:40px;border-radius:50%;font-size:1.2rem;line-height:1}
.form{display:grid;gap:8px}
.form div{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px}
.form b{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--surface2);font-size:1.1rem}
.ex{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.ex li{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.ex li span{flex:1;min-width:0}
.say{border:0;background:var(--surface2);width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex:none}
.say svg{width:18px;height:18px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips span{background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:4px 10px;font-size:.88rem}
.mist{display:grid;gap:6px}
.mist div{padding:8px 12px;border-radius:10px;background:var(--surface);border:1px solid var(--line)}
.mist .w{text-decoration:line-through;text-decoration-color:var(--bad);color:var(--muted)}
.mist .w::before{content:"✗ ";color:var(--bad);font-weight:700}
.mist .r::before{content:"✓ ";color:var(--good);font-weight:700}
ul.uses{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}

/* quiz */
.q{display:flex;flex-direction:column;gap:8px}
.q p{font-weight:500}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.opts button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;min-height:44px;font-weight:500}
.opts button.right{background:var(--good);border-color:var(--good);color:var(--surface)}
.opts button.wrong{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.opts button:disabled{cursor:default}
.fb{font-size:.9rem;font-weight:500}
.fb.ok{color:var(--good)} .fb.no{color:var(--bad)}

/* verbs */
.sub{display:flex;gap:6px;flex-wrap:wrap}
.sub button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 14px;font-weight:500}
.sub button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.search{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);font:inherit}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.95rem}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;background:var(--surface2)}
td.v1{font-weight:600}
td.mn{white-space:normal;color:var(--muted);font-size:.85rem;min-width:120px}
tr:last-child td{border-bottom:0}
.star{border:1px solid var(--line);background:var(--surface);border-radius:8px;width:34px;height:34px;font-weight:700;color:var(--muted)}
.star.on{background:var(--good);border-color:var(--good);color:var(--surface)}
.snd{font-size:.72rem;font-weight:600;padding:2px 7px;border-radius:6px;background:var(--surface2)}
.flash{min-height:230px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;border:2px solid var(--line);border-radius:18px;background:var(--surface);padding:20px;width:100%}
.flash .w{font-size:2.4rem;font-weight:700;letter-spacing:-.02em}
.flash .f{display:flex;gap:18px;flex-wrap:wrap;justify-content:center}
.flash .f div{display:flex;flex-direction:column;align-items:center}
.flash .f b{font-size:1.5rem}
.flash .f span{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.typed{display:flex;gap:8px;flex-wrap:wrap}
.typed input{flex:1 1 160px;min-width:0;padding:11px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);font:inherit;font-size:1.1rem}

/* videos */
.ch{display:flex;flex-direction:column;gap:10px}
.ch .row{flex-wrap:nowrap}
.ch .av{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--surface2);font-weight:700;flex:none}
.lesson-list{display:flex;flex-direction:column;gap:8px}
.lesson-list a{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;text-decoration:none;color:var(--ink);background:var(--surface)}
.lesson-list a span{flex:1;min-width:0}
.play{width:30px;height:22px;border-radius:6px;background:#E62117;display:grid;place-items:center;flex:none}
.play::after{content:"";border-left:8px solid #fff;border-top:5px solid transparent;border-bottom:5px solid transparent;margin-left:2px}

/* time */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,140px),1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.kpi b{display:block;font-size:1.45rem;font-weight:700;line-height:1.2}
.kpi span{font-size:.8rem;color:var(--muted)}
.bars{position:relative;display:grid;grid-template-columns:repeat(7,1fr);gap:8px;height:170px;align-items:end;padding-top:22px;border-bottom:1px solid var(--line)}
.bars .b{position:relative;height:100%;display:flex;align-items:flex-end;justify-content:center}
.bars .b i{display:block;width:min(36px,100%);background:var(--accent);border-radius:4px 4px 0 0;min-height:2px}
.bars .b.t i{background:var(--present)}
.bars .b em{position:absolute;font-style:normal;font-size:.75rem;font-weight:600;transform:translateY(-18px);white-space:nowrap}
.goal-line{position:absolute;left:0;right:0;border-top:2px dashed var(--muted);opacity:.6;pointer-events:none}
.goal-line span{position:absolute;right:0;top:-18px;font-size:.7rem;color:var(--muted);background:var(--surface);padding:0 4px}
.blabels{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;text-align:center;font-size:.75rem;color:var(--muted);margin-top:6px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .d{aspect-ratio:1;max-width:100%;border-radius:8px;background:var(--surface2);position:relative;display:grid;place-items:center;font-size:.72rem;overflow:hidden}
.cal .d i{position:absolute;inset:0;background:var(--present)}
.cal .d span{position:relative}
.cal .d.hi span{color:var(--surface);font-weight:600}
.cal .d.today{outline:2px solid var(--ink);outline-offset:1px}
.cal .wd{text-align:center;font-size:.7rem;color:var(--muted)}
.legend{display:flex;gap:6px;align-items:center;font-size:.75rem;color:var(--muted)}
.legend i{width:14px;height:14px;border-radius:4px;background:var(--present);display:inline-block}
.goalpick{display:flex;gap:6px;flex-wrap:wrap}
.goalpick button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 12px;font-weight:500}
.goalpick button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:500;z-index:60;max-width:calc(100% - 32px);text-align:center}
.route{display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px 0;overflow:hidden}
.unit{width:100%;display:flex;align-items:center;gap:10px;margin:14px 0 4px}
.unit::before,.unit::after{content:"";flex:1;border-top:2px dashed var(--line)}
.unit span{font-weight:700;font-size:.82rem;padding:4px 12px;border-radius:99px;background:var(--surface2);white-space:nowrap}
.node{display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:none;padding:6px 4px;width:160px;max-width:100%;text-align:center;color:var(--ink)}
.node .c{width:66px;height:66px;border-radius:50%;display:grid;place-items:center;background:var(--surface2);color:var(--muted);border:3px solid var(--line);box-shadow:0 5px 0 var(--line)}
.node .c svg{width:28px;height:28px}
.node.check .c{border-radius:20px}
.node.done .c{background:var(--good);border-color:var(--good);color:var(--surface);box-shadow:0 5px 0 color-mix(in srgb,var(--good) 65%,var(--ink))}
.node.cur .c{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:0 5px 0 color-mix(in srgb,var(--accent) 65%,var(--ink));outline:5px solid color-mix(in srgb,var(--accent) 22%,transparent);outline-offset:3px}
.node b{font-size:.86rem;line-height:1.25}
.node small{font-size:.72rem;color:var(--muted);line-height:1.3}
.node.lock{opacity:.55}
.start-tag{background:var(--accent);color:var(--accent-ink);font-size:.68rem;font-weight:700;padding:2px 8px;border-radius:6px;text-transform:uppercase;letter-spacing:.05em}
.finish{display:flex;flex-direction:column;align-items:center;gap:4px;margin-top:10px;text-align:center}
.finish .c{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;background:var(--hl);color:var(--hl-ink);font-weight:700}
.pill{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:.85rem;padding:5px 12px;border-radius:99px}
.pill.ok{background:var(--good);color:var(--surface)}
.pill.no{background:var(--surface2);color:var(--bad)}
.pin{display:flex;gap:8px;flex-wrap:wrap}
.pin input{flex:0 1 140px;min-width:0;padding:11px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);font:inherit;font-size:1.2rem;letter-spacing:.3em;text-align:center}
.tchips{display:flex;gap:6px;flex-wrap:wrap}
.tchips span{font-size:.82rem;padding:4px 10px;border-radius:99px;border:1px solid var(--line);color:var(--muted);background:var(--surface)}
.tchips span.on{background:var(--good);border-color:var(--good);color:var(--surface);font-weight:600}
.chat{display:flex;flex-direction:column;gap:10px}
.msg{display:flex;gap:6px;align-items:flex-end}
.msg.me{justify-content:flex-end}

/* timeline drawing: past | now | future */
function tl(type,time){
  const c="var(--"+time+")",y=34;let s="";
  const dotC=(x,col)=>'<circle cx="'+x+'" cy="'+y+'" r="6" fill="'+(col||c)+'"/>';
  const barC=(a,b,col)=>'<rect x="'+a+'" y="'+(y-5)+'" width="'+(b-a)+'" height="10" rx="5" fill="'+(col||c)+'"/>';
  const arc=(a,b,col)=>'<path d="M'+a+' '+y+' Q'+((a+b)/2)+' '+(y-26)+' '+b+' '+y+'" fill="none" stroke="'+(col||c)+'" stroke-width="3" stroke-linecap="round"/><circle cx="'+a+'" cy="'+y+'" r="4" fill="'+(col||c)+'"/>';
  const flag=x=>'<line x1="'+x+'" y1="'+(y-16)+'" x2="'+x+'" y2="'+(y+8)+'" stroke="var(--ink)" stroke-width="2"/><text x="'+x+'" y="'+(y-19)+'" text-anchor="middle">'+L("deadline")+'</text>';
  switch(type){
    case"state":s=barC(30,210)+'';break;
    case"habit":[40,70,100,130,160,190].forEach(x=>s+=dotC(x));break;
    case"now":s=barC(96,144);break;
    case"pastdot":s=dotC(60);break;
    case"pastbar":s=barC(35,95)+'<line x1="72" y1="'+(y-14)+'" x2="72" y2="'+(y+14)+'" stroke="var(--ink)" stroke-width="2.5"/>';break;
    case"perfect":s=arc(55,120);break;
    case"perfcont":s=barC(50,124);break;
    case"futdot":s=dotC(180);break;
    case"plan":s='<line x1="120" y1="'+y+'" x2="172" y2="'+y+'" stroke="'+c+'" stroke-width="3" stroke-dasharray="5 4"/>'+dotC(180);break;
    case"pastperf":s=dotC(40)+dotC(90,"var(--muted)")+'<text x="40" y="'+(y-12)+'" text-anchor="middle">1st</text><text x="90" y="'+(y-12)+'" text-anchor="middle">2nd</text>';break;
    case"pastperfcont":s=barC(25,82)+dotC(92,"var(--muted)");break;
    case"futbar":s=barC(160,206)+'<line x1="183" y1="'+(y-14)+'" x2="183" y2="'+(y+14)+'" stroke="var(--ink)" stroke-width="2.5"/>';break;
    case"futperf":s=arc(135,180)+flag(205);break;
    case"futperfcont":s=barC(130,205)+flag(205);break;
  }
  return '<svg class="tl" viewBox="0 0 240 64" role="img" aria-label="Timeline"><line x1="8" y1="'+y+'" x2="232" y2="'+y+'" stroke="var(--line)" stroke-width="2"/><line x1="120" y1="12" x2="120" y2="48" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="3 3"/>'+s+'<text x="30" y="60" text-anchor="middle">'+L("Past")+'</text><text x="120" y="60" text-anchor="middle" style="font-weight:600">'+L("Now")+'</text><text x="210" y="60" text-anchor="middle">'+L("Future")+'</text></svg>';
}

function weekSec(){const d=new Date();const wd=(d.getDay()+6)%7;let s=0;for(let i=0;i<=wd;i++){const x=new Date(d);x.setDate(d.getDate()-i);s+=dayTotal(dk(x))}return s}
function monthSec(){const d=new Date();let s=0;for(let i=1;i<=d.getDate();i++)s+=dayTotal(dk(new Date(d.getFullYear(),d.getMonth(),i)));return s}
function totalSec(){return allKeys().reduce((a,k)=>a+dayTotal(k),0)}
function streak(){const d=new Date();let n=0;if(dayTotal(dk(d))<300)d.setDate(d.getDate()-1);while(dayTotal(dk(d))>=300){n++;d.setDate(d.getDate()-1)}return n}
function vTime(){
  const ks=allKeys(),days=ks.filter(k=>dayTotal(k)>=60).length;let best=0,bestK="";ks.forEach(k=>{const v=dayTotal(k);if(v>best){best=v;bestK=k}});

   [[fmt(dayTotal(dk())),L("Today")],[fmt(weekSec()),L("this week (Mon–Sun)")],[fmt(monthSec()),L("this month")],[fmt(totalSec()),L("total")],[L("{n} days",{n:streak()}),L("streak")],[L("{n} days",{n:days}),L("days studied")]].map(k=>'<div class="kpi"><b class="num">'+k[0]+'</b><span>'+k[1]+'</span></div>').join("")+'</div></section>';
  const last=[];for(let i=6;i>=0;i--){const x=new Date();x.setDate(x.getDate()-i);last.push({k:dk(x),d:x,v:dayTotal(dk(x))/60})}
  const gm=S.goal,mx=Math.max(gm*1.2,...last.map(l=>l.v))||1,top=Math.max(...last.map(z=>z.v));
  const WD=WDN[S.lang]||WDN.en;
  h+='<section class="card stack"><div class="row between"><h3>'+L("Last 7 days")+'</h3><span class="small muted">'+L("minutes per day")+'</span></div><div class="bars">'+
   last.map((l,i)=>'<div class="b'+(i===6?" t":"")+'" title="'+WD[l.d.getDay()]+": "+Math.round(l.v)+'"><i style="height:'+(l.v/mx*100)+'%"></i>'+(i===6||(l.v===top&&l.v>0)?'<em class="num" style="bottom:'+(l.v/mx*100)+'%">'+Math.round(l.v)+'</em>':"")+'</div>').join("")+
   '<div class="goal-line" style="bottom:'+(gm/mx*100)+'%"><span>'+L("goal {n}",{n:gm})+'</span></div></div><div class="blabels">'+last.map((l,i)=>'<span>'+(i===6?L("Today"):WD[l.d.getDay()])+'</span>').join("")+'</div>'+
   '<div class="tbl-wrap"><table><thead><tr><th>'+L("Day")+'</th><th>'+L("Minutes")+'</th><th>'+L("Goal")+'</th></tr></thead><tbody>'+last.slice().reverse().map(l=>'<tr><td>'+WD[l.d.getDay()]+' '+l.d.getDate()+'</td><td class="num">'+Math.round(l.v)+'</td><td>'+(l.v>=gm?'<span class="tag ok">'+L("✓ done")+'</span>':'<span class="tag">—</span>')+'</td></tr>').join("")+'</tbody></table></div></section>';
  const now=new Date(),y=now.getFullYear(),m=now.getMonth(),first=(new Date(y,m,1).getDay()+6)%7,nd=new Date(y,m+1,0).getDate();
  const wh=WD.slice(1).concat(WD[0]);
  let cal='<div class="cal">'+wh.map(w=>'<div class="wd">'+w+'</div>').join("");
  for(let i=0;i<first;i++)cal+='<div></div>';
  for(let d=1;d<=nd;d++){const v=dayTotal(dk(new Date(y,m,d)))/60;const p=v<=0?0:Math.min(1,.2+.8*v/gm);
    cal+='<div class="d'+(d===now.getDate()?" today":"")+(p>=.6?" hi":"")+'" title="'+d+": "+Math.round(v)+'">'+(p?'<i style="opacity:'+p.toFixed(2)+'"></i>':"")+'<span class="num">'+d+'</span></div>'}
  cal+='</div>';
  h+='<section class="card stack"><div class="row between"><h3>'+(MON[S.lang]||MON.en)[m]+' '+y+'</h3><span class="legend">'+L("less")+' <i style="opacity:.25"></i><i style="opacity:.6"></i><i></i> '+L("goal reached")+'</span></div>'+cal+(best?'<p class="small muted">'+L("Best day ever: <b>{x}</b> on {k}.",{x:fmt(best),k:bestK})+'</p>':"")+'</section>';
  h+='<section class="card stack"><h3>'+L("Daily goal")+': '+fmt(S.goal*60)+'</h3><p class="small muted">'+L("Your mum sets your daily goal.")+'</p>'+(sum7v()?'<p class="small">'+L("Videos you added")+': <b class="num">'+fmt(sum7v())+'</b> ('+L("Last 7 days").toLowerCase()+')</p>':"")+'</section>';
  return h;
}

function barsHtml(n){

}

     WCHECK.map((c,i)=>'<button class="chk'+(PQ.chk[i]?" on":"")+'" data-a="wchk" data-v="'+i+'" aria-pressed="'+!!PQ.chk[i]+'"><span class="box">'+(PQ.chk[i]?"✓":"")+'</span>'+esc(L(c))+'</button>').join("")+'</div>'+
     '<div><button class="btn primary" data-a="wdone">'+L("Done")+'</button></div></div>';
  }

}

 ["Shart gaplar: If it rains… / If I were rich…","if qismida hech qachon will ishlatmang. 2-shartda hamma uchun were: If I were…",["1-shart: kelajakda bo'lishi mumkin bo'lgan haqiqiy holat. If it rains, we will stay at home.","2-shart: hozirgi haqiqiy bo'lmagan, xayoliy holat. If I were rich, I would buy a big house.","0-shart: doim to'g'ri narsalar. If you heat ice, it melts."]],
 ["Условные предложения: If it rains… / If I were rich…","В части с if никогда не используйте will. Во 2-м типе для всех were: If I were…",["1-й тип: реальная возможная ситуация в будущем. If it rains, we will stay at home.","2-й тип: нереальная, воображаемая ситуация сейчас. If I were rich, I would buy a big house.","Нулевой тип: то, что всегда верно. If you heat ice, it melts."]]);
G("passive",{n:"Passive voice",s:"The car was made in Japan",
 uses:["Use the passive when the action is more important than who did it: English is spoken all over the world.","Use by to say who did it: This book was written by J. K. Rowling.","Present: am / is / are + V3. Past: was / were + V3."],
 f:["be + V3 (past participle)","is made · was made · has been made · will be made","by + person (if needed)"],
 ex:["Plov [is cooked] in a big pot.","The Registan [was built] many years ago.","This photo [was taken] by my dad.","The windows [are cleaned] every week.","The letter [has been sent]."],
 sig:["by","when the doer is not important"],m:["The house was build in 1990.","The house was built in 1990."],tip:"Always use V3: write → written, make → made, build → built.",
 q:[["English ___ in many countries.",["speaks","is spoken","is speaking"],1],["This bridge ___ in 1950.",["was built","built","is build"],0],["The cake was made ___ my mum.",["from","by","with"],1],["The rooms ___ every day.",["are cleaned","clean","are clean"],0]]},
 ["Majhul nisbat: The car was made in Japan","Har doim V3 ishlating: write → written, make → made, build → built.",["Ish-harakat kim bajarganidan muhimroq bo'lganda: English is spoken all over the world.","Kim bajarganini aytish uchun by: This book was written by J. K. Rowling.","Hozirgi: am / is / are + V3. O'tgan: was / were + V3."]],
 ["Пассивный залог: The car was made in Japan","Всегда используйте V3: write → written, make → made, build → built.",["Когда действие важнее, чем тот, кто его сделал: English is spoken all over the world.","by — чтобы сказать, кто сделал: This book was written by J. K. Rowling.","Настоящее: am / is / are + V3. Прошедшее: was / were + V3."]]);
G("usedto",{n:"used to",s:"Past habits that stopped",
 uses:["Things you often did in the past but don't do now: I used to play with toy cars.","Past states that changed: There used to be a cinema here."],
 f:["used to + verb","didn't use to + verb","Did you use to + verb?"],
 ex:["I [used to] live in Samarkand.","She [used to] have long hair.","We [didn't use to] have a car.","[Did] you [use to] like vegetables?"],
 sig:["when I was a child","before","not any more"],m:["I use to play football when I was young.","I used to play football when I was young."],tip:"After did / didn't write use to (no d).",
 q:[["I ___ to be afraid of dogs.",["use","used","using"],1],["Did you ___ to play outside?",["used","use","using"],1],["He ___ use to like fish.",["didn't","doesn't","wasn't"],0],["There ___ a park here, but now it's a car park.",["used to be","use to be","was used"],0]]},
 ["O'tmishdagi, endi to'xtagan odatlar","did / didn't dan keyin use to yoziladi (d siz).",["O'tmishda tez-tez qilgan, endi qilmaydigan ishlar: I used to play with toy cars.","O'zgargan o'tmish holatlari: There used to be a cinema here."]],
 ["Привычки в прошлом, которых больше нет","После did / didn't пишем use to (без d).",["То, что вы часто делали раньше, но не делаете сейчас: I used to play with toy cars.","Состояния в прошлом, которые изменились: There used to be a cinema here."]]);
G("gerinf",{n:"Gerund or infinitive",s:"I enjoy swimming / I want to swim",
 uses:["Some verbs take -ing: enjoy, finish, mind, stop, avoid, keep. I enjoy reading.","Some verbs take to + verb: want, need, decide, hope, plan, learn, promise, agree. I want to learn English.","After prepositions always use -ing: I'm good at drawing. Thanks for helping me."],
 f:["enjoy / finish / avoid + verb-ing","want / decide / hope + to + verb","preposition + verb-ing"],
 ex:["I [enjoy playing] chess.","She [decided to study] medicine.","He [finished doing] his homework.","We [hope to see] you soon.","I'm interested [in learning] Korean."],
 sig:["after prepositions → -ing"],m:["I want learning English.","I want to learn English."],tip:"Learn verbs in groups: enjoy + -ing, want + to.",
 q:[["I enjoy ___ to music.",["listen","to listen","listening"],2],["She wants ___ a doctor.",["become","to become","becoming"],1],["Thank you for ___ me.",["help","to help","helping"],2],["They decided ___ by train.",["to travel","travelling","travel"],0]]},
 ["Gerund yoki infinitiv: enjoy swimming / want to swim","Fe'llarni guruh bilan yodlang: enjoy + -ing, want + to.",["Ba'zi fe'llardan keyin -ing: enjoy, finish, mind, stop, avoid, keep. I enjoy reading.","Ba'zilaridan keyin to + fe'l: want, need, decide, hope, plan, learn, promise, agree. I want to learn English.","Predlogdan keyin doim -ing: I'm good at drawing. Thanks for helping me."]],
 ["Герундий или инфинитив: enjoy swimming / want to swim","Учите глаголы группами: enjoy + -ing, want + to.",["После некоторых глаголов -ing: enjoy, finish, mind, stop, avoid, keep. I enjoy reading.","После других to + глагол: want, need, decide, hope, plan, learn, promise, agree. I want to learn English.","После предлогов всегда -ing: I'm good at drawing. Thanks for helping me."]]);
G("relcl",{n:"Relative clauses",s:"who, which, that, where, whose",
 uses:["who / that for people: The boy who lives next door is my friend.","which / that for things: This is the phone which I bought yesterday.","where for places, whose for possession: This is the school where I study. She's the girl whose brother is a pilot."],
 f:["person + who / that","thing + which / that","place + where · whose + noun"],
 ex:["The woman [who] teaches us English is very kind.","I lost the book [which] you gave me.","This is the café [where] we met.","He's the man [whose] car was stolen.","The film [that] we watched was boring."],
 sig:["who","which","that","where","whose"],m:["The man which lives here is a doctor.","The man who lives here is a doctor."],tip:"You can often drop who / which / that when it is the object: The book (that) I read was good.",
 q:[["The girl ___ won the race is my sister.",["which","who","where"],1],["This is the house ___ I was born.",["where","which","who"],0],["I like films ___ are funny.",["who","which","whose"],1],["That's the boy ___ dog bit me.",["who","whose","which"],1]]},
 ["Nisbiy gaplar: who, which, that, where, whose","who / which / that to'ldiruvchi bo'lsa, ko'pincha tushirib qoldiriladi: The book (that) I read was good.",["Odamlar uchun who / that: The boy who lives next door is my friend.","Narsalar uchun which / that: This is the phone which I bought yesterday.","Joy uchun where, egalik uchun whose: This is the school where I study. She's the girl whose brother is a pilot."]],
 ["Придаточные определительные: who, which, that, where, whose","who / which / that часто можно опустить, если это дополнение: The book (that) I read was good.",["Для людей who / that: The boy who lives next door is my friend.","Для предметов which / that: This is the phone which I bought yesterday.","Для мест where, для принадлежности whose: This is the school where I study. She's the girl whose brother is a pilot."]]);
G("cond3",{n:"3rd and mixed conditionals",s:"If I had studied, I would have passed",
 uses:["3rd conditional: an imagined past that didn't happen. If I had studied, I would have passed.","Mixed conditional: a past action with a result now. If I had slept more, I wouldn't be tired now."],
 f:["3rd: If + had + V3, would have + V3","Mixed: If + had + V3, would + verb (now)","could have / might have + V3"],
 ex:["[If] we [had left] earlier, we [wouldn't have missed] the bus.","[If] she [had known], she [would have helped].","[If] I [hadn't eaten] so much, I [wouldn't feel] sick now.","We [could have won] if we [had played] better."],
 sig:["regrets about the past"],m:["If I would have known, I would have come.","If I had known, I would have come."],tip:"No would in the if part: If I had known (not: If I would have known).",
 q:[["If you ___ me, I would have helped you.",["told","had told","would tell"],1],["If I had seen him, I ___ hello.",["would say","would have said","said"],1],["If she had taken the medicine, she ___ better now.",["would feel","would have felt","feels"],0],["We ___ the match if we had trained more.",["won","would win","might have won"],2]]},
 ["3-shart va aralash shart gaplar","if qismida would bo'lmaydi: If I had known (If I would have known emas).",["3-shart: o'tmishdagi bo'lmagan, xayoliy holat. If I had studied, I would have passed.","Aralash shart: o'tmishdagi ish va hozirgi natija. If I had slept more, I wouldn't be tired now."]],
 ["3-й тип и смешанные условные","В части с if нет would: If I had known (не If I would have known).",["3-й тип: воображаемое прошлое, которого не было. If I had studied, I would have passed.","Смешанный тип: действие в прошлом и результат сейчас. If I had slept more, I wouldn't be tired now."]]);
G("reported",{n:"Reported speech",s:"She said that she was tired",
 uses:["Tell what someone said. The tense usually moves one step back: \"I am tired.\" → She said (that) she was tired.","Questions: no question word order. \"Where do you live?\" → He asked where I lived.","Orders and requests: told / asked + to. \"Close the door.\" → She told me to close the door."],
 f:["present → past · past → past perfect · will → would","said (that)… · told me (that)…","asked if / where… · told me to…"],
 ex:["\"I like pizza.\" → He said he [liked] pizza.","\"I will call you.\" → She said she [would call] me.","\"Are you OK?\" → He asked [if I was] OK.","\"Don't be late.\" → Mum told me [not to be] late."],
 sig:["said","told","asked"],m:["He said me that he was busy.","He told me that he was busy."],tip:"say something · tell someone something.",
 q:[["\"I am hungry.\" → She said she ___ hungry.",["is","was","has been"],1],["\"I will help.\" → He said he ___ help.",["will","would","can"],1],["\"Where is the station?\" → She asked where the station ___.",["is it","was","was it"],1],["He ___ me to sit down.",["said","told","asked to"],1]]},
 ["O'zlashtirma gap: She said that she was tired","say something (nimadir demoq) · tell someone something (kimgadir aytmoq).",["Kimdir nima deganini aytish. Zamon odatda bir qadam orqaga suriladi: \"I am tired.\" → She said (that) she was tired.","Savollar: so'roq tartibi bo'lmaydi. \"Where do you live?\" → He asked where I lived.","Buyruq va iltimoslar: told / asked + to. \"Close the door.\" → She told me to close the door."]],
 ["Косвенная речь: She said that she was tired","say something · tell someone something.",["Передать чужие слова. Время обычно сдвигается на шаг назад: \"I am tired.\" → She said (that) she was tired.","Вопросы: без вопросительного порядка слов. \"Where do you live?\" → He asked where I lived.","Просьбы и приказы: told / asked + to. \"Close the door.\" → She told me to close the door."]]);
G("deduct",{n:"Modals of deduction",s:"must be, can't be, might have been",
 uses:["Now: must (I'm sure it's true), can't (I'm sure it's not true), might / may / could (maybe). He must be tired. That can't be Ali.","Past: modal + have + V3. She must have forgotten. They might have missed the bus. He can't have seen us."],
 f:["must / might / can't + verb (now)","must / might / can't + have + V3 (past)","could / may = maybe"],
 ex:["You've been working all day. You [must be] tired.","That [can't be] true!","Where's Sara? She [might be] at home.","The ground is wet. It [must have rained].","He [can't have finished] already. He started five minutes ago."],
 sig:["I'm sure","maybe","it's impossible"],m:["He mustn't be at home; the lights are off.","He can't be at home; the lights are off."],tip:"The opposite of must (sure yes) is can't (sure no), not mustn't.",
 q:[["She's crying. She ___ be sad.",["must","can't","mustn't"],0],["That ___ be Tom. He's in London!",["must","can't","might"],1],["I can't find my keys. I ___ have left them at school.",["might","can't","must not"],0],["The street is wet. It ___ have rained.",["can't","must","mustn't"],1]]},
 ["Taxmin modallari: must be, can't be, might have been","must (aniq ha) ning teskarisi can't (aniq yo'q), mustn't emas.",["Hozir: must (aniq shunday), can't (aniq unday emas), might / may / could (balki). He must be tired. That can't be Ali.","O'tmish: modal + have + V3. She must have forgotten. They might have missed the bus. He can't have seen us."]],
 ["Модальные глаголы предположения: must be, can't be, might have been","Противоположность must (точно да) — can't (точно нет), а не mustn't.",["Сейчас: must (уверен, что да), can't (уверен, что нет), might / may / could (возможно). He must be tired. That can't be Ali.","Прошлое: модальный + have + V3. She must have forgotten. They might have missed the bus. He can't have seen us."]]);
G("wish",{n:"Wish and if only",s:"I wish I had more time",
 uses:["A wish about now: wish + past simple. I wish I had a dog (but I don't).","A regret about the past: wish + past perfect. I wish I had studied harder (but I didn't).","Complaining about others: wish + would. I wish you would stop talking."],
 f:["wish + past simple (now)","wish + had + V3 (past)","wish + would + verb (annoying habits)"],
 ex:["I [wish] I [knew] the answer.","She [wishes] she [lived] by the sea.","I [wish] I [hadn't said] that.","[If only] I [had listened] to you!","I [wish] it [would stop] raining."],
 sig:["regret","dream"],m:["I wish I have a car.","I wish I had a car."],tip:"If only = a stronger wish: If only I were taller!",
 q:[["I wish I ___ taller.",["am","were","will be"],1],["I wish I ___ that cake. Now I feel sick.",["didn't eat","hadn't eaten","don't eat"],1],["I wish you ___ so much noise.",["wouldn't make","don't make","won't make"],0],["If only I ___ the answer now!",["know","knew","had known"],1]]},
 ["Wish va if only: I wish I had more time","If only = kuchliroq istak: If only I were taller!",["Hozir haqida istak: wish + past simple. I wish I had a dog (lekin yo'q).","O'tmish haqida afsus: wish + past perfect. I wish I had studied harder (lekin o'qimadim).","Boshqalardan norozilik: wish + would. I wish you would stop talking."]],
 ["Wish и if only: I wish I had more time","If only = более сильное желание: If only I were taller!",["Желание о настоящем: wish + past simple. I wish I had a dog (но собаки нет).","Сожаление о прошлом: wish + past perfect. I wish I had studied harder (но не учился).","Недовольство другими: wish + would. I wish you would stop talking."]]);
G("phrasal",{n:"Phrasal verbs",s:"give up, look after, find out",
 uses:["A phrasal verb = verb + small word with a new meaning: give up = stop trying, look after = take care of.","Some can be split: turn the TV off / turn it off. With pronouns always split: turn it off (not turn off it).","Learn them by topic: daily life, school, friends."],
 f:["verb + up / out / on / off / after…","separable: pick it up","not separable: look after her"],
 ex:["Don't [give up]! You can do it.","Can you [look after] my cat?","I need to [find out] the answer.","Please [turn off] the light.","She [gets on with] her sister very well."],
 sig:["very common in speaking"],m:["Turn off it, please.","Turn it off, please."],tip:"Learn 3 new phrasal verbs every week, each with an example sentence.",
 q:[["Never ___ up on your dreams.",["give","take","look"],0],["Who will look ___ the baby?",["for","after","at"],1],["Please turn ___ the music. It's too loud.",["down","in","out"],0],["I want to find ___ the truth.",["up","out","off"],1]]},
 ["Frazali fe'llar: give up, look after, find out","Har hafta misol gap bilan 3 ta yangi frazali fe'l yodlang.",["Frazali fe'l = fe'l + kichik so'z, yangi ma'no: give up = harakatni to'xtatmoq, look after = g'amxo'rlik qilmoq.","Ba'zilari ajratiladi: turn the TV off / turn it off. Olmosh bilan doim ajratiladi: turn it off (turn off it emas).","Ularni mavzu bo'yicha yodlang: kundalik hayot, maktab, do'stlar."]],
 ["Фразовые глаголы: give up, look after, find out","Учите 3 новых фразовых глагола в неделю, каждый с примером.",["Фразовый глагол = глагол + маленькое слово с новым значением: give up = сдаться, look after = заботиться.","Некоторые разделяются: turn the TV off / turn it off. С местоимением всегда разделяются: turn it off (не turn off it).","Учите их по темам: быт, школа, друзья."]]);
G("inversion",{n:"Inversion for emphasis",s:"Never have I seen…",
 uses:["After a negative word at the start, use question order for strong emphasis: Never have I seen such a beautiful place.","Common starters: Never, Rarely, Seldom, Not only… but also, Hardly… when, No sooner… than, Only then.","Used in formal writing and speaking (IELTS band 7+)."],
 f:["negative adverb + auxiliary + subject + verb","Not only + auxiliary + subject…, but also…","Hardly had + subject + V3 … when …"],
 ex:["[Never have I] eaten such delicious food.","[Not only is] she clever, but she is also kind.","[Rarely do] we see such talent.","[Hardly had I] arrived when it started to rain.","[Only then did I] understand the problem."],
 sig:["Never","Rarely","Not only","Hardly","No sooner"],m:["Never I have seen this.","Never have I seen this."],tip:"Don't overuse it. One or two inversions in an essay is enough.",
 q:[["Never ___ such a big crowd.",["I have seen","have I seen","I saw"],1],["Not only ___ fast, but he is also strong.",["he is","is he","he was"],1],["Rarely ___ go to bed before midnight.",["do I","I do","I"],0],["No sooner had we sat down ___ the phone rang.",["when","than","then"],1]]},
 ["Ta'kid uchun inversiya: Never have I seen…","Haddan tashqari ishlatmang. Inshoda bir-ikki inversiya yetarli.",["Gap inkor so'z bilan boshlansa, kuchli ta'kid uchun so'roq tartibi ishlatiladi: Never have I seen such a beautiful place.","Ko'p ishlatiladiganlar: Never, Rarely, Seldom, Not only… but also, Hardly… when, No sooner… than, Only then.","Rasmiy yozuv va nutqda ishlatiladi (IELTS 7+ ball)."]],
 ["Инверсия для усиления: Never have I seen…","Не злоупотребляйте: одной-двух инверсий в эссе достаточно.",["Если предложение начинается с отрицательного слова, для усиления используется вопросительный порядок: Never have I seen such a beautiful place.","Частые начала: Never, Rarely, Seldom, Not only… but also, Hardly… when, No sooner… than, Only then.","Используется в формальной речи и письме (IELTS 7+)."]]);
G("cleft",{n:"Cleft sentences",s:"What I need is… / It was Ali who…",
 uses:["Use cleft sentences to put focus on one part of the sentence.","What-clefts: What I really need is a holiday.","It-clefts: It was my teacher who helped me most."],
 f:["What + subject + verb + is / was + focus","It is / was + focus + who / that…","The reason why… is that…"],
 ex:["[What I love about] Tashkent [is] the food.","[It was] my grandmother [who] taught me to read.","[What] surprised me [was] the price.","[The reason why] I study English [is that] I want to travel.","[It is] practice [that] makes you fluent."],
 sig:["focus","emphasis"],m:["What I need it is more time.","What I need is more time."],tip:"Great for IELTS Speaking: What I like most about… is…",
 q:[["___ I need is a good night's sleep.",["That","What","Which"],1],["It was my dad ___ fixed the car.",["who","what","which"],0],["What surprised me ___ the weather.",["were","was","it was"],1],["The reason ___ I left is that I was tired.",["why","because","what"],0]]},
 ["Ajratib ko'rsatuvchi gaplar: What I need is… / It was Ali who…","IELTS Speaking uchun juda foydali: What I like most about… is…",["Gapning bir qismini ajratib ko'rsatish uchun ishlatiladi.","What bilan: What I really need is a holiday.","It bilan: It was my teacher who helped me most."]],
 ["Расщеплённые предложения: What I need is… / It was Ali who…","Отлично для IELTS Speaking: What I like most about… is…",["Используются, чтобы выделить одну часть предложения.","С what: What I really need is a holiday.","С it: It was my teacher who helped me most."]]);
G("linking",{n:"Linking words for essays",s:"however, whereas, therefore, despite",
 uses:["Contrast: however, whereas, although, despite + noun / -ing, on the other hand.","Result: therefore, as a result, consequently.","Adding ideas and examples: moreover, in addition, furthermore, for instance.","Conclusion: in conclusion, overall, to sum up."],
 f:["However, … (new sentence, with a comma)","Although + clause · Despite + noun / -ing","Therefore / As a result, …"],
 ex:["Cities offer many jobs. [However], they are expensive.","[Although] it was raining, we went out.","[Despite] the rain, we went out.","Prices rose. [As a result], sales fell.","[In conclusion], the benefits outweigh the drawbacks."],
 sig:["IELTS Writing: coherence and cohesion"],m:["Despite it was cold, we swam.","Although it was cold, we swam."],tip:"Don't start every sentence with a linking word. Use a variety.",
 q:[["___ the traffic, we arrived on time.",["Although","Despite","However"],1],["I like tea, ___ my sister prefers coffee.",["whereas","despite","therefore"],0],["He didn't study. ___, he failed.",["However","As a result","Although"],1],["___ it was late, she kept working.",["Despite","Although","In addition"],1]]},
 ["Insho uchun bog'lovchi so'zlar: however, whereas, therefore, despite","Har bir gapni bog'lovchi so'z bilan boshlamang. Turlicha ishlating.",["Qarama-qarshilik: however, whereas, although, despite + ot / -ing, on the other hand.","Natija: therefore, as a result, consequently.","Qo'shimcha fikr va misol: moreover, in addition, furthermore, for instance.","Xulosa: in conclusion, overall, to sum up."]],
 ["Связующие слова для эссе: however, whereas, therefore, despite","Не начинайте каждое предложение со связки. Используйте разные.",["Противопоставление: however, whereas, although, despite + сущ. / -ing, on the other hand.","Результат: therefore, as a result, consequently.","Добавление и примеры: moreover, in addition, furthermore, for instance.","Вывод: in conclusion, overall, to sum up."]]);
G("partcl",{n:"Participle clauses",s:"Feeling tired, I went to bed",
 uses:["Make sentences shorter and more advanced: Feeling tired, I went to bed (= Because I felt tired…).","-ing for active meaning: Walking home, I saw an old friend.","V3 for passive meaning: Built in 1420, the madrasa is famous.","Having + V3 for an earlier action: Having finished my homework, I watched TV."],
 f:["verb-ing …, main clause","V3 …, main clause (passive)","Having + V3 …, main clause"],
 ex:["[Looking] out of the window, she saw the sea.","[Written] in simple English, the book is easy to read.","[Having lived] abroad, he speaks three languages.","[Not knowing] the answer, I stayed quiet."],
 sig:["formal writing"],m:["Walking home, the rain started.","Walking home, I got caught in the rain."],tip:"Both parts must have the same subject.",
 q:[["___ tired, I went to bed early.",["Feel","Feeling","Felt"],1],["___ in 1889, the tower is very famous.",["Building","Built","Having built"],1],["___ finished his work, he went home.",["Having","Being","Had"],0],["___ the news, she started to cry.",["Hearing","Heard","To hear"],0]]},
 ["Sifatdosh oborotlari: Feeling tired, I went to bed","Ikkala qismning egasi bir xil bo'lishi kerak.",["Gaplarni qisqaroq va yuqori darajada qiladi: Feeling tired, I went to bed (= Because I felt tired…).","-ing — aniq nisbat ma'nosi: Walking home, I saw an old friend.","V3 — majhul nisbat ma'nosi: Built in 1420, the madrasa is famous.","Having + V3 — avvalroq bo'lgan ish: Having finished my homework, I watched TV."]],
 ["Причастные обороты: Feeling tired, I went to bed","У обеих частей должно быть одно подлежащее.",["Делают предложения короче и сложнее: Feeling tired, I went to bed (= Because I felt tired…).","-ing — активное значение: Walking home, I saw an old friend.","V3 — пассивное значение: Built in 1420, the madrasa is famous.","Having + V3 — более раннее действие: Having finished my homework, I watched TV."]]);
G("hedging",{n:"Academic style and hedging",s:"It could be argued that…",
 uses:["In academic writing, don't sound too sure: It is likely that…, This may suggest…, It could be argued that…","Use impersonal forms instead of I think: It is widely believed that…, Many experts claim that…","Use nouns to sound formal (nominalisation): Prices increased → There was an increase in prices."],
 f:["It is likely / possible / widely believed + that…","may / might / could + verb · tend to + verb","verb → noun: develop → development, decide → decision"],
 ex:["[It could be argued that] technology isolates people.","Young people [tend to] spend more time online.","[It is widely believed that] exercise improves health.","[There was a sharp increase in] unemployment.","This [may suggest that] the policy failed."],

 q:[["___ that social media affects sleep.",["It is widely believed","I am 100% sure","Everybody knows"],0],["Teenagers ___ to sleep later than adults.",["tend","are tend","tending"],0],["The government decided → the government's ___",["decide","decision","deciding"],1],["This ___ suggest that the plan was successful.",["may","must to","is"],0]]},

 ["Академический стиль и смягчение: It could be argued that…","Сочетайте осторожные фразы с ясным мнением. В IELTS Task 2 позиция всё равно должна быть ясной.",["В академическом письме не звучите слишком категорично: It is likely that…, This may suggest…, It could be argued that…","Безличные формы вместо I think: It is widely believed that…, Many experts claim that…","Используйте существительные (номинализация): Prices increased → There was an increase in prices."]]);

 uses:["into / out of: go in or leave. She ran into the room. He got out of the car.","up / down: higher or lower. We climbed up the hill. The ball rolled down the stairs.","across / through / along: Walk across the road. The train went through the tunnel. We walked along the river.","to / from / towards / past / around / over / under: Go past the bank. Jump over the fence."],

 sig:["Where to?","go, walk, run, drive"],m:["She went in the room.","She went into the room."],tip:"in / on = where something is. into / onto = moving to a place.",

 ["Предлоги движения: into, out of, up, down, across, through","in / on = где находится. into / onto = движение куда-то.",["into / out of: войти или выйти. She ran into the room. He got out of the car.","up / down: вверх или вниз. We climbed up the hill. The ball rolled down the stairs.","across (через) / through (сквозь) / along (вдоль): Walk across the road. The train went through the tunnel. We walked along the river.","to / from / towards / past / around / over / under: Go past the bank. Jump over the fence."]]);

G("svo",{n:"Sentence structure: Subject + Verb + Object",s:"Who + does + what",
 uses:["Subject = who or what does the action. It comes first: I, Ali, my sister, the dog.","Verb = the action or the state: play, eat, go, like, am / is / are.","Object = who or what gets the action. It comes after the verb: football, an apple, my mother.","Place and time go at the end: I play football in the park every day."],
 f:["Subject + Verb + Object (+ place + time)","Subject + be (am / is / are) + adjective / noun / place","Never start with the verb or the object: Ali likes apples."],
 ex:["[I] play football.","[My sister] reads books.","[Ali] likes apples.","[We] watch TV in the evening.","[She] is a teacher."],
 sig:["Who?","What does he do?","What?"],m:["I football play.","I play football."],tip:"Uzbek: Men futbol o'ynayman (subject + object + verb). English: I play football (subject + verb + object). In English the verb comes BEFORE the object!",
 q:[["Choose the correct sentence:",["I football play.","I play football.","Play I football."],1],["In “Ali eats an apple”, the SUBJECT is…",["Ali","eats","an apple"],0],["In “She reads a book”, the VERB is…",["She","reads","a book"],1],["In “We love our mother”, the OBJECT is…",["We","love","our mother"],2]]},
 ["Gap tuzilishi: Kim + nima qiladi + nimani","O'zbekcha: Men futbol o'ynayman (ega + to'ldiruvchi + kesim). Inglizcha: I play football (ega + kesim + to'ldiruvchi). Inglizchada fe'l to'ldiruvchidan OLDIN keladi!",["Subject (ega) = kim yoki nima ish bajaradi. Gap boshida keladi: I, Ali, my sister, the dog.","Verb (kesim, fe'l) = ish-harakat yoki holat: play, eat, go, like, am / is / are.","Object (to'ldiruvchi) = ish kimga yoki nimaga qaratilgan. Fe'ldan keyin keladi: football, an apple, my mother.","Joy va vaqt gap oxirida keladi: I play football in the park every day."]],
 ["Строение предложения: Кто + делает + что","В русском порядок слов свободный, а в английском строгий: I play football (подлежащее + глагол + дополнение). Глагол всегда стоит ПЕРЕД дополнением!",["Subject (подлежащее) = кто или что делает действие. Стоит в начале: I, Ali, my sister, the dog.","Verb (сказуемое, глагол) = действие или состояние: play, eat, go, like, am / is / are.","Object (дополнение) = на кого или что направлено действие. Стоит после глагола: football, an apple, my mother.","Место и время — в конце: I play football in the park every day."]]);

  }else{
    h+='<p class="small muted">'+L("Listen. Which picture is it?")+'</p><div><button class="btn" data-a="say" data-v="'+esc(it.w.en)+'">🔊 '+L("Play again")+'</button></div><div class="vopts">'+it.o.map((w,j)=>{let c="";if(PQ.ans!==null){if(j===it.a)c="right";else if(j===PQ.ans)c="wrong"}return '<button class="vopt '+c+'" data-a="vqa" data-v="'+j+'"'+(PQ.ans!==null?" disabled":"")+'>'+w.e+'<small>'+esc(vtr(w))+'</small></button>'}).join("")+'</div>';
  }

  return h+'</section>';
}
